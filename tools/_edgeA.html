<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>edgeA</title></head>
<body>
<div id="out">running</div>
<iframe id="a" src="/pc.html?room=5555&debug=1" width="900" height="650"></iframe>
<iframe id="b" src="/pc.html?room=5555&debug=1" width="900" height="650"></iframe>
<script>
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const pill = (doc, sel) => { const e = doc.querySelector(sel + ' .pill__text'); return e ? e.textContent : 'MISS'; };
const logs = (doc, n = 7) => Array.from(doc.querySelectorAll('.log__line')).map((e) => e.textContent).slice(-n).join(' | ');
async function run() {
  await wait(24000);
  const a = document.getElementById('a').contentWindow;
  const b = document.getElementById('b').contentWindow;
  const rows = [];
  const P = (k, v) => { rows.push(k + '=' + v); console.log('[EDGE] ' + k + '=' + v); };
  P('A.webrtc.pill', pill(a.document, '#pill-webrtc'));
  P('A.mqtt.pill', pill(a.document, '#pill-mqtt'));
  P('A.data.pill', pill(a.document, '#pill-data'));
  P('B.webrtc.pill', pill(b.document, '#pill-webrtc'));
  P('B.mqtt.pill', pill(b.document, '#pill-mqtt'));
  P('B.data.pill', pill(b.document, '#pill-data'));
  P('A.rtcState', a.__vf ? a.__vf.transport.status.webrtc.state + '/' + a.__vf.transport.status.webrtc.detail : '-');
  P('B.rtcState', b.__vf ? b.__vf.transport.status.webrtc.state + '/' + b.__vf.transport.status.webrtc.detail : '-');
  P('A.mqttState', a.__vf ? a.__vf.transport.status.mqtt.state : '-');
  P('B.mqttState', b.__vf ? b.__vf.transport.status.mqtt.state : '-');
  P('A.log', logs(a.document, 6));
  P('B.log', logs(b.document, 6));
  document.getElementById('out').textContent = rows.join('\n');
}
window.addEventListener('load', () => setTimeout(() => {
  run().catch((e) => { document.getElementById('out').textContent = 'ERR ' + e.message; console.log('[EDGE] ERR ' + e.message); });
}, 500));
</script>
</body></html>
