<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>edgeB</title></head>
<body>
<div id="out">running</div>
<iframe id="ph" src="/phone.html?room=6666" width="380" height="700"></iframe>
<div id="holder"></div>
<script>
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const pill = (doc, sel) => { const e = doc.querySelector(sel + ' .pill__text'); return e ? e.textContent : 'MISS'; };
const logs = (doc, n = 8) => Array.from(doc.querySelectorAll('.log__line')).map((e) => e.textContent).slice(-n).join(' | ');
async function run() {
  const rows = [];
  const P = (k, v) => { rows.push(k + '=' + v); console.log('[EDGE] ' + k + '=' + v); };
  const ph = () => document.getElementById('ph').contentWindow;
  await wait(11000);
  P('t11.ph.link', pill(ph().document, '#pill-link'));
  P('t11.ph.room', pill(ph().document, '#pill-room'));
  P('t11.ph.log', logs(ph().document, 5));
  // now bring the PC online in the same room
  const f = document.createElement('iframe');
  f.id = 'pc'; f.width = 900; f.height = 650; f.src = '/pc.html?room=6666&debug=1';
  document.getElementById('holder').appendChild(f);
  console.log('[EDGE] t11 pc iframe added');
  await wait(24000);
  const pc = () => document.getElementById('pc').contentWindow;
  P('t35.ph.link', pill(ph().document, '#pill-link'));
  P('t35.ph.room', pill(ph().document, '#pill-room'));
  P('t35.ph.log', logs(ph().document, 6));
  P('t35.pc.webrtc', pill(pc().document, '#pill-webrtc') + ' / ' + pc().__vf.transport.status.webrtc.state + '/' + pc().__vf.transport.status.webrtc.detail);
  P('t35.pc.data', pill(pc().document, '#pill-data'));
  P('t35.pc.orientCount', pc().__vf.transport.stats.orientCount);
  P('t35.pc.primaryChannel', pc().__vf.transport.stats.primaryChannel);
  P('t35.pc.rtcAttempts_viaPhone', ph().__vf ? 'hasVF' : 'noVF');
  document.getElementById('out').textContent = rows.join('\n');
}
window.addEventListener('load', () => setTimeout(() => {
  run().catch((e) => { document.getElementById('out').textContent = 'ERR ' + e.message; console.log('[EDGE] ERR ' + e.message); });
}, 300));
</script>
</body></html>
