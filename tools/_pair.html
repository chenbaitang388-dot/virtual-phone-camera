<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>pair probe</title>
<style>
html,body{margin:0;background:#111;color:#eee;font:12px/1.45 monospace}
#out{white-space:pre;padding:8px}
.panes{display:flex;gap:6px;align-items:flex-start}
iframe{border:1px solid #444;background:#000}
</style></head><body>
<div id="out">no-result</div>
<div class="panes">
  <iframe id="pc" src="/pc.html?room=7777&debug=1" width="1100" height="700"></iframe>
  <iframe id="ph" src="/phone.html?room=7777" width="380" height="700"></iframe>
</div>
<script>
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const fmt = (n) => (+n).toFixed(4);
const qs = (o) => (o ? [o.x, o.y, o.z, o.w].map(fmt).join(',') : '-');

async function run() {
  const pcWin = document.getElementById('pc').contentWindow;
  const phWin = document.getElementById('ph').contentWindow;
  const pcDoc = pcWin.document;
  const phDoc = phWin.document;
  const log = (m) => console.log('[PAIR] ' + m);
  const rows = [];
  const push = (k, v) => { rows.push(k + '=' + v); log(k + '=' + v); };

  await wait(12000); // 让两边各自连上信令服务器并互相找到
  const vf = pcWin.__vf;
  push('pc.hasVF', typeof vf);

  const pillText = (doc, sel) => {
    const el = doc.querySelector(sel + ' .pill__text');
    return el ? el.textContent : 'MISSING';
  };

  push('pc.pill.webrtc', pillText(pcDoc, '#pill-webrtc'));
  push('pc.pill.mqtt', pillText(pcDoc, '#pill-mqtt'));
  push('pc.pill.data', pillText(pcDoc, '#pill-data'));
  push('pc.stat.primaryChannel', pcDoc.querySelector('#s-chan').textContent);
  push('pc.stat.rtt', pcDoc.querySelector('#s-rtt').textContent);
  push('pc.stat.packets', pcDoc.querySelector('#s-pkts').textContent);
  push('pc.stat.fps', pcDoc.querySelector('#s-fps').textContent);
  push('pc.peerActive', vf.transport.peerActive);
  push('pc.orientCount', vf.transport.stats.orientCount);
  push('pc.duplicates', vf.transport.stats.duplicates);
  push('pc.received', vf.transport.stats.received);
  push('pc.channelStates', JSON.stringify({ webrtc: vf.transport.status.webrtc.state, mqtt: vf.transport.status.mqtt.state }));

  push('ph.pill.link', pillText(phDoc, '#pill-link'));
  push('ph.pill.room', pillText(phDoc, '#pill-room'));
  push('ph.sent', phDoc.querySelector('#v-sent').textContent);
  push('ph.log', Array.from(phDoc.querySelectorAll('.log__line')).map((e) => e.textContent).slice(-4).join(' || '));

  // ---- 在手机端模拟"按住右看键"，看电脑端是否跟着转 ----
  const pad = phDoc.querySelector('#pad');
  push('ph.padFound', !!pad);
  push('pose.beforeNudge', qs(vf.studio._orientation));

  const zone = phDoc.querySelector('.pad__zone--right');
  const rect = zone.getBoundingClientRect();
  const cx = rect.left + rect.width / 2;
  const cy = rect.top + rect.height / 2;
  const mk = (type, x, y) => new phWin.PointerEvent(type, {
    pointerId: 1, pointerType: 'touch', isPrimary: true, bubbles: true,
    clientX: x, clientY: y, buttons: type === 'pointerup' ? 0 : 1,
  });
  zone.dispatchEvent(mk('pointerdown', cx, cy));
  await wait(900);
  push('pose.duringNudge.offsetIndicator', phDoc.querySelector('#horizon') ? 'present' : 'absent');
  zone.dispatchEvent(mk('pointerup', cx, cy));
  await wait(900);
  push('pose.afterNudge', qs(vf.studio._orientation));
  push('pose.afterNudgeIdle', vf.studio.idle);
  push('pc.orientCountAfterNudge', vf.transport.stats.orientCount);

  // ---- 手机端拖动空白处，验证 drag 偏移 ----
  const blankX = rect.left - 40;
  const blankY = rect.top - 30;
  pad.dispatchEvent(mk('pointerdown', blankX, blankY));
  for (let i = 0; i < 12; i++) {
    pad.dispatchEvent(mk('pointermove', blankX - i * 6, blankY + i * 2));
    await wait(30);
  }
  pad.dispatchEvent(mk('pointerup', blankX - 72, blankY + 24));
  await wait(1200);
  push('pose.afterDrag', qs(vf.studio._orientation));

  // ---- 手机端灵敏度滑杆是否把 ctrl 消息送回电脑端 ----
  const gain = phDoc.querySelector('#rng-gain');
  gain.value = '1.8';
  gain.dispatchEvent(new phWin.Event('input', { bubbles: true }));
  await wait(1200);
  push('pc.gainAfterPhoneSlider', vf.smoother.gain);
  push('pc.gainSliderUi', pcDoc.querySelector('#rng-gain').value);
  push('pc.gainLabelUi', pcDoc.querySelector('#val-gain').textContent);

  const text = rows.join('\n');
  log('=== SUMMARY ===\n' + text);
  try { localStorage.setItem('__vfpair', text); } catch (e) { /* 无所谓 */ }
  document.getElementById('out').textContent = 'RESULT=\n' + text;
}

const stored = localStorage.getItem('__vfpair');
if (stored) {
  document.getElementById('out').textContent = 'STORED=\n' + stored;
} else if (new URLSearchParams(location.search).get('run') === '1') {
  window.addEventListener('load', () => setTimeout(() => {
    run().catch((e) => {
      console.log('[PAIR] RUN ERROR ' + e.message + '\n' + e.stack);
      document.getElementById('out').textContent = 'RUN ERROR: ' + e.message;
    });
  }, 500));
} else {
  document.getElementById('out').textContent = 'idle';
}
</script>
</body></html>
