<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0b0e14" />
<title>手机端 · 虚拟手机摄像头遥控器</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='11' fill='%2338bdf8'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%230b0e14'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="./assets/css/style.css" />
<script src="./vendor/peerjs.min.js"></script>
<script src="./vendor/mqtt.min.js"></script>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js" } }
</script>
</head>
<body>
<div class="app app--phone">
  <header class="topbar">
    <div class="brand">
      <span class="brand-logo">◉</span>
      <b>遥控器</b>
    </div>
    <div class="spacer"></div>
    <span class="pill" id="pill-room"><span class="dot dot--warn"></span><span class="pill__text">未配对</span></span>
    <span class="pill" id="pill-link"><span class="dot dot--bad"></span><span class="pill__text">未连接</span></span>
  </header>

  <main class="main">
    <section class="panel" id="setup-panel">
      <div class="panel__title">1 · 配对电脑</div>
      <div class="panel__body">
        <div class="field">
          <label class="field__label" for="code">电脑端显示的 6 位房间码</label>
          <input class="input code-input" id="code" autocomplete="off" autocapitalize="off"
                 autocorrect="off" spellcheck="false" maxlength="6" placeholder="k7m2qp" />
        </div>
        <button class="btn btn--primary btn--block" id="btn-connect">连接电脑</button>
      </div>
    </section>

    <section class="panel" id="gyro-panel">
      <div class="panel__title">2 · 陀螺仪</div>
      <div class="panel__body">
        <button class="btn btn--primary btn--block" id="btn-gyro">启用陀螺仪</button>

        <div class="row">
          <button class="btn btn--ghost btn--sm" id="btn-recal" style="flex:1 1 0;">设正</button>
          <button class="btn btn--ghost btn--sm" id="btn-level" style="flex:1 1 0;">校平</button>
        </div>

        <div class="grid-stats">
          <div class="stat"><span class="stat__k">左右</span><span class="stat__v" id="v-yaw">0°</span></div>
          <div class="stat"><span class="stat__k">俯仰</span><span class="stat__v" id="v-pitch">0°</span></div>
          <div class="stat"><span class="stat__k">翻滚</span><span class="stat__v" id="v-roll">0°</span></div>
          <div class="stat"><span class="stat__k">已发送</span><span class="stat__v" id="v-sent">0</span></div>
        </div>

        <canvas id="horizon" aria-label="姿态指示仪"></canvas>

        <div class="row">
          <span class="muted mono" id="v-screen">屏幕：竖屏</span>
          <span class="muted mono" id="v-level">自动校平：开</span>
        </div>

        <button class="btn btn--ghost btn--block btn--sm" id="btn-pause">暂停发送</button>

        <div class="help" id="gyro-help">
          iPhone 必须点上面的按钮授权，页面必须是 <b>HTTPS</b>。
          没有陀螺仪也能用方向键或拖动画面。
        </div>

        <div class="help">
          灵敏度固定 <b>1:1</b>：手机转多少度，电脑里的虚拟手机就转多少度，
          不做放大也不做缩小。读数以「设正」那一刻为零点。
        </div>
      </div>
    </section>

    <section class="pad" id="pad">
      <div class="pad__zone pad__zone--up" data-dir="up">↑ 抬头</div>
      <div class="pad__zone pad__zone--left" data-dir="left">← 左看</div>
      <div class="pad__zone pad__zone--center" data-dir="center">设正</div>
      <div class="pad__zone pad__zone--right" data-dir="right">右看 →</div>
      <div class="pad__zone pad__zone--down" data-dir="down">↓ 低头</div>
      <span class="pad__hint" style="grid-column:1/-1;grid-row:4;">在空白处拖动也能转视角 · 方向键可按住连续微调</span>
    </section>

    <details class="panel">
      <summary class="panel__title" style="cursor:pointer;list-style:none;">日志</summary>
      <div class="panel__body">
        <div class="log" id="log"></div>
      </div>
    </details>
  </main>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import * as THREE from 'three';
import { DualTransport } from './src/transport.js';
import { MSG, normalizeRoom, isValidRoom, isFiniteQuaternion } from './src/protocol.js';
import {
  OrientationSource, RelativeOrientation, needsPermissionGesture,
  supportsDeviceOrientation, screenOrientationLabel,
} from './src/orientation.js';
import { $, createLogger, createToast, setPill } from './src/ui.js';

const log = createLogger($('#log'));
const toast = createToast($('#toast'));

// 手机端只负责显示相对角度，真正的校准在电脑端执行。
const relative = new RelativeOrientation();
const poseScratch = new THREE.Quaternion();
let rollLock = true;
// 新连接或刚开陀螺仪时，用第一帧真实姿态主动请求一次设正
let recenterOnNextSample = true;

function controlQuaternion(value) {
  return isFiniteQuaternion(value) ? new THREE.Quaternion().fromArray(value) : null;
}

// ---- 配对 ---------------------------------------------------------------

const params = new URLSearchParams(location.search);
$('#code').value = normalizeRoom(params.get('room'));

let transport = null;

const STATE_LABEL = { idle: '待机', connecting: '连接中', open: '已连', failed: '不可用' };

function connect(code) {
  if (!isValidRoom(code)) {
    toast('房间码是 6 位字母数字，请核对电脑端显示的那串', 'err');
    return;
  }
  if (transport) transport.close();
  // 新连接重新对零点：第一帧真实姿态会请求电脑端一起设正
  relative.reset();
  recenterOnNextSample = true;
  transport = new DualTransport({ room: code, role: 'phone' });
  transport.onMessage(onMessage);
  transport.onStatus(paintStatus);
  transport.start();
  params.set('room', code);
  history.replaceState(null, '', `${location.pathname}?${params}`);
  log.ok(`开始连接房间 ${code}`);
  toast(`正在连接房间 ${code}`);
}

function onMessage(msg, channel) {
  if (msg.t === MSG.CTRL) {
    if (typeof msg.rollLock === 'boolean') {
      rollLock = msg.rollLock;
      $('#v-level').textContent = `自动校平：${rollLock ? '开' : '关'}`;
    }
    if (msg.recenter === true) {
      recenterOnNextSample = false;
      relative.calibrate(controlQuaternion(msg.q) || currentQuaternion());
      log.info('电脑端已设正，手机读数归零');
    }
    if (msg.level === true) {
      recenterOnNextSample = false;
      relative.level(controlQuaternion(msg.q) || currentQuaternion());
      log.info('电脑端已校平');
    }
    return;
  }
  if (msg.t === MSG.PING) return;
  if (msg.t === MSG.PONG) return;
  if (channel === 'webrtc' || channel === 'mqtt') {
    log.info(`收到电脑端消息：${msg.t}`);
  }
}

function paintStatus(snap) {
  const active = snap.peerActive;
  // 只有真的收到过电脑端的消息才收起配对面板。
  // 不能只看 MQTT 通道是否打开：房间码打错时 MQTT 也能连上 broker，
  // 那样会把输入框藏起来，用户连改都没法改。
  document.querySelector('.app').classList.toggle('is-linked', snap.stats.received > 0);
  setPill($('#pill-link'), active ? 'ok' : (snap.anyChannelOpen ? 'warn' : 'bad'),
    active ? '已连上电脑' : (snap.anyChannelOpen ? '等待电脑响应' : '未连接'));
  const roomPill = $('#pill-room');
  const roomLabel = isValidRoom(snap.room) ? `房间 ${snap.room}` : '未配对';
  if (Number.isFinite(snap.stats.rtt)) {
    setPill(roomPill, 'ok', `${roomLabel} · ${snap.stats.rtt.toFixed(0)}ms`);
  } else {
    setPill(roomPill, isValidRoom(snap.room) ? 'ok' : 'warn', roomLabel);
  }
}

// onStatus 只在通道状态变化时触发，但"电脑端是否在响应"是随时间变化的，
// 所以要自己定时重画一次，否则胶囊可能一直停在过期的文案上。
setInterval(() => {
  if (transport) paintStatus(transport.snapshot());
}, 500);

if (isValidRoom($('#code').value)) {
  connect($('#code').value);
} else {
  log.info('等待输入电脑端显示的 6 位房间码，或直接用手机相机扫电脑上的二维码');
}

$('#btn-connect').addEventListener('click', () => connect(normalizeRoom($('#code').value)));
$('#code').addEventListener('input', (e) => {
  e.target.value = normalizeRoom(e.target.value);
});
$('#code').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') connect(normalizeRoom(e.target.value));
});

// ---- 陀螺仪 -------------------------------------------------------------

const source = new OrientationSource();
let gyroOn = false;
let sending = true;
let sentCount = 0;

if (!supportsDeviceOrientation()) {
  $('#btn-gyro').disabled = true;
  $('#btn-gyro').textContent = '此设备没有陀螺仪';
  $('#gyro-help').textContent = '这台设备/浏览器没有提供方向传感器。用下面的方向键或拖动画面来转视角即可。';
  log.warn('没有检测到 deviceorientation，只能用触摸控制');
} else if (!window.isSecureContext) {
  $('#btn-gyro').disabled = true;
  $('#btn-gyro').textContent = '需要 HTTPS 才能用陀螺仪';
  log.err('当前不是 HTTPS，手机浏览器会拒绝提供陀螺仪数据');
}

$('#btn-gyro').addEventListener('click', async () => {
  try {
    await source.start();
    gyroOn = true;
    relative.reset();
    recenterOnNextSample = true;
    $('#btn-gyro').classList.add('hidden');
    $('#gyro-help').textContent = '陀螺仪已开启。拿起手机转动、抬头、低头，电脑里的虚拟手机就会跟着动。';
    log.ok('陀螺仪已开启');
    toast('陀螺仪已开启');
    navigator.vibrate?.(60);
    // 授权成功不等于真的有传感器（部分平板/模拟器会"批准但不供数据"），
    // 所以等一下再确认一次，别让用户以为是别的地方坏了。
    setTimeout(() => {
      if (source.hasData) return;
      $('#gyro-help').textContent =
        '陀螺仪权限已通过，但收不到传感器数据。这台设备可能没有方向传感器，' +
        '用下面的方向键或直接在空白处拖动也能转视角。';
      log.warn('已授权但 1.5 秒内没收到 deviceorientation 数据，可能没有传感器');
    }, 1500);
  } catch (err) {
    log.err(`开启陀螺仪失败：${err.message}`);
    toast(err.message, 'err');
    if (needsPermissionGesture()) {
      $('#gyro-help').textContent = '被拒绝了。请在 iOS 设置 → Safari → 动作与方向访问 里允许，再重新点一次这个按钮。';
    }
  }
});

// ---- 触摸偏移 -----------------------------------------------------------

const OFFSET_LIMIT = 1.35;
let offsetYaw = 0;
let offsetPitch = 0;
const offsetQuat = new THREE.Quaternion();
const offsetEuler = new THREE.Euler();

function rebuildOffset() {
  offsetYaw = Math.max(-OFFSET_LIMIT, Math.min(OFFSET_LIMIT, offsetYaw));
  offsetPitch = Math.max(-OFFSET_LIMIT, Math.min(OFFSET_LIMIT, offsetPitch));
  offsetEuler.set(offsetPitch, offsetYaw, 0, 'YXZ');
  offsetQuat.setFromEuler(offsetEuler);
}

function resetOffset() {
  offsetYaw = 0;
  offsetPitch = 0;
  rebuildOffset();
}

// 按下按钮这一刻的准确姿态（含触摸微调）。发给电脑端当校准零点，
// 这样两边用的是同一个四元数，不会因为网络延迟差出一帧。
function currentQuaternion() {
  if (gyroOn && source.hasData) source.readInto(poseScratch, offsetQuat);
  else poseScratch.copy(offsetQuat);
  return poseScratch;
}

function recalibrate(from = '按钮') {
  resetOffset();
  const q = currentQuaternion();
  relative.calibrate(q);
  transport?.send(MSG.CTRL, { recenter: true, q: q.toArray() });
  log.info(`${from}设正：手机当前朝向 = 正前方，读数归零`);
  toast('已设正，读数归零');
  navigator.vibrate?.(40);
}

function levelHorizon(from = '按钮') {
  const q = currentQuaternion();
  relative.level(q);
  transport?.send(MSG.CTRL, { level: true, q: q.toArray() });
  log.info(`${from}校平：地平线转正，朝向和俯仰不变`);
  toast('已校平，地平线水平');
  navigator.vibrate?.(40);
}

const held = { up: false, down: false, left: false, right: false };
const pad = $('#pad');

// setPointerCapture 在指针已经不活跃时会抛错（比如手指刚抬起的那一帧），吞掉即可。
function capture(el, pointerId) {
  try { el.setPointerCapture?.(pointerId); } catch { /* 指针已失效 */ }
}

pad.addEventListener('pointerdown', (e) => {
  const zone = e.target.closest('.pad__zone');
  if (!zone) return;
  e.preventDefault();
  const dir = zone.dataset.dir;
  if (dir === 'center') {
    recalibrate('方向盘');
    return;
  }
  held[dir] = true;
  capture(zone, e.pointerId);
});

['pointerup', 'pointercancel', 'pointerleave'].forEach((type) => {
  pad.addEventListener(type, (e) => {
    const zone = e.target.closest?.('.pad__zone');
    const dir = zone?.dataset.dir;
    if (dir && dir in held) held[dir] = false;
  });
});
window.addEventListener('blur', () => { held.up = held.down = held.left = held.right = false; });

// 空白处拖动 = 在陀螺仪朝向之上叠加一个微调偏移
let dragId = null;
let dragX = 0;
let dragY = 0;
const DRAG_GAIN = 0.006;

pad.addEventListener('pointerdown', (e) => {
  if (e.target.closest('.pad__zone')) return;
  dragId = e.pointerId;
  dragX = e.clientX;
  dragY = e.clientY;
  capture(pad, dragId);
});

pad.addEventListener('pointermove', (e) => {
  if (dragId === null || e.pointerId !== dragId) return;
  const dx = e.clientX - dragX;
  const dy = e.clientY - dragY;
  dragX = e.clientX;
  dragY = e.clientY;
  offsetYaw -= dx * DRAG_GAIN;
  offsetPitch -= dy * DRAG_GAIN;
  rebuildOffset();
});

['pointerup', 'pointercancel'].forEach((type) => {
  pad.addEventListener(type, (e) => {
    if (e.pointerId === dragId) dragId = null;
  });
});

// ---- 发送循环 -----------------------------------------------------------

const outgoing = new THREE.Quaternion();
let lastFrame = performance.now();

setInterval(() => {
  const now = performance.now();
  const dt = Math.min(0.1, (now - lastFrame) / 1000);
  lastFrame = now;

  const speed = 1.9;
  if (held.left) offsetYaw += speed * dt;
  if (held.right) offsetYaw -= speed * dt;
  if (held.up) offsetPitch += speed * dt;
  if (held.down) offsetPitch -= speed * dt;
  if (held.left || held.right || held.up || held.down) rebuildOffset();

  if (!sending) return;
  if (gyroOn && source.hasData) {
    source.readInto(outgoing, offsetQuat);
    if (recenterOnNextSample) {
      // 刚连上或刚开陀螺仪：把第一帧真实姿态同时设成两边的零点。
      // 否则电脑端会先拿空姿态（或上一台手机的姿态）当零点，开陀螺仪瞬间画面会跳。
      relative.calibrate(outgoing);
      // 通道还没通时 send 会返回 false，下个采样继续重试，不能提前把标志清掉
      if (transport?.send(MSG.CTRL, { recenter: true, q: outgoing.toArray() })) {
        recenterOnNextSample = false;
        log.info('已自动把手机当前朝向设为正前方');
      }
    } else if (!relative.calibrated) {
      relative.calibrate(outgoing);
    }
  } else if (offsetYaw !== 0 || offsetPitch !== 0) {
    outgoing.copy(offsetQuat);
  } else {
    // 既没陀螺仪也没触摸偏移时不发姿态包：空四元数会被电脑端误当成首帧零点。
    // 手机是否在线由传输层的 PING 心跳负责，这里不需要占位包。
    return;
  }

  transport?.send(MSG.ORIENT, {
    q: outgoing.toArray(),
    // 屏幕方向：电脑端显示竖屏/横屏，并据此确认姿态换算用的是同一个角度
    sa: source.screenAngle(),
  });
  sentCount++;
}, 1000 / 60);

// ---- 读数与姿态指示仪 ----------------------------------------------------

const horizon = $('#horizon');

function drawHorizon() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = Math.max(1, horizon.clientWidth);
  const h = Math.max(1, horizon.clientHeight);
  if (horizon.width !== Math.round(w * dpr) || horizon.height !== Math.round(h * dpr)) {
    horizon.width = Math.round(w * dpr);
    horizon.height = Math.round(h * dpr);
  }
  const ctx = horizon.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);

  ctx.fillStyle = '#060a11';
  ctx.fillRect(0, 0, w, h);

  const live = gyroOn && source.hasData && relative.calibrated;
  let pitch = 0;
  let roll = 0;
  let heading = 0;
  if (live) {
    const angles = relative.readAngles(outgoing, rollLock);
    pitch = angles.pitch;
    roll = angles.roll;
    heading = angles.yaw;
  }

  const cx = w / 2;
  const cy = h / 2 + 6;
  const pitchScale = h / 90;

  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(-roll * Math.PI / 180);

  const offsetY = pitch * pitchScale;
  ctx.strokeStyle = '#38bdf8';
  ctx.lineWidth = 1.6;
  ctx.beginPath();
  ctx.moveTo(-w * 0.46, offsetY);
  ctx.lineTo(w * 0.46, offsetY);
  ctx.stroke();

  ctx.lineWidth = 1;
  ctx.strokeStyle = 'rgba(56,189,248,0.55)';
  ctx.font = '9px ui-monospace, monospace';
  ctx.fillStyle = 'rgba(148,163,184,0.85)';
  ctx.textAlign = 'center';
  for (let deg = -30; deg <= 30; deg += 10) {
    if (deg === 0) continue;
    const y = offsetY - deg * pitchScale;
    const half = deg % 20 === 0 ? 22 : 12;
    ctx.beginPath();
    ctx.moveTo(-half, y);
    ctx.lineTo(half, y);
    ctx.stroke();
    if (deg % 20 === 0) ctx.fillText(String(deg), -half - 12, y + 3);
  }
  ctx.restore();

  // 固定在屏幕中央的准星
  ctx.strokeStyle = '#fbbf24';
  ctx.lineWidth = 1.6;
  ctx.beginPath();
  ctx.moveTo(w / 2, h / 2 + 6);
  ctx.lineTo(w / 2 - 16, h / 2 + 6);
  ctx.moveTo(w / 2, h / 2 + 6);
  ctx.lineTo(w / 2 + 16, h / 2 + 6);
  ctx.moveTo(w / 2, h / 2 + 6);
  ctx.lineTo(w / 2, h / 2 + 2);
  ctx.stroke();

  // 顶部方位刻度带
  ctx.save();
  ctx.fillStyle = 'rgba(11,14,20,0.75)';
  ctx.fillRect(0, 0, w, 16);
  ctx.fillStyle = 'rgba(148,163,184,0.9)';
  ctx.font = '10px ui-monospace, monospace';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const step = 30;
  const shift = (heading % step) / step * 40;
  for (let i = -3; i <= 3; i++) {
    const value = Math.round((heading + i * step) / step) * step;
    const x = w / 2 + i * 40 - shift;
    const label = ((value % 360) + 360) % 360;
    ctx.fillText(`${label}°`, x, 8);
    ctx.fillStyle = 'rgba(148,163,184,0.35)';
    ctx.fillRect(x - 0.5, 14, 1, 2);
    ctx.fillStyle = 'rgba(148,163,184,0.9)';
  }
  ctx.restore();

  // 偏移量指示：拖动或方向键带来的微调幅度
  const deviation = Math.hypot(offsetYaw, offsetPitch);
  if (deviation > 0.01) {
    ctx.fillStyle = 'rgba(251,191,36,0.9)';
    ctx.font = '10px ui-monospace, monospace';
    ctx.textAlign = 'left';
    ctx.fillText(`微调 ${(deviation * 180 / Math.PI).toFixed(0)}°`, 6, h - 6);
  }
}

setInterval(() => {
  $('#v-sent').textContent = String(sentCount);
  const has = gyroOn && source.hasData;
  if (has) {
    const a = relative.readAngles(outgoing, rollLock);
    $('#v-yaw').textContent = `${a.yaw.toFixed(0)}°`;
    $('#v-pitch').textContent = `${a.pitch.toFixed(0)}°`;
    $('#v-roll').textContent = `${a.roll.toFixed(0)}°`;
    $('#gyro-help').textContent = source.absolute
      ? '陀螺仪工作中（带磁力计，左右漂移会自动修正）。'
      : '陀螺仪工作中。如果左右方向慢慢跑偏，点「设正」重新对一次零点。';
  } else {
    $('#v-yaw').textContent = '—';
    $('#v-pitch').textContent = '—';
    $('#v-roll').textContent = '—';
  }
}, 150);

// ---- 横竖屏 -------------------------------------------------------------

function paintScreenMode() {
  $('#v-screen').textContent = `屏幕：${screenOrientationLabel(source.screenAngle())}`;
}
paintScreenMode();
window.addEventListener('resize', paintScreenMode);
window.addEventListener('orientationchange', () => setTimeout(paintScreenMode, 150));
if (screen.orientation?.addEventListener) {
  screen.orientation.addEventListener('change', () => setTimeout(paintScreenMode, 80));
}

(function tick() {
  drawHorizon();
  requestAnimationFrame(tick);
})();

// ---- 其他控件 -----------------------------------------------------------

$('#btn-recal').addEventListener('click', () => recalibrate());
$('#btn-level').addEventListener('click', () => levelHorizon());

$('#btn-pause').addEventListener('click', (e) => {
  sending = !sending;
  e.target.textContent = sending ? '暂停发送' : '继续发送';
  log.warn(sending ? '恢复发送姿态' : '已暂停发送，电脑端会切回待机动画');
});

window.addEventListener('beforeunload', () => {
  source.stop();
  transport?.close();
});

if (params.get('debug') === '1') {
  window.__phone = {
    source, relative, recalibrate, levelHorizon,
    transport: () => transport,
    outgoing: () => outgoing.toArray(),
  };
  log.warn('已开启调试钩子 window.__phone');
}

log.info('手机端已就绪');
</script>
</body>
</html>
