name: Deploy to GitHub Pages

# 触发条件：
#   - 推送到 main 分支时自动部署
#   - 也可以在 GitHub 网页的 Actions 页面手动触发（workflow_dispatch）
on:
  push:
    branches:
      - main
  workflow_dispatch:

# 部署到 GitHub Pages 所需的最小权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一个时间只允许一个 Pages 部署。cancel-in-progress 设为 false，
# 表示已经在跑的部署不被打断，避免把站点发布到一半就取消。
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # 第一步：把整个仓库打包成 Pages 产物
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # 新仓库默认没有开启 Pages，这个开关让工作流自己把 Pages 打开，
          # 省得还要手动去 Settings → Pages 里点一遍。
          enablement: true

      # 纯静态站点没有构建步骤，直接把仓库根目录整个上传。
      # upload-pages-artifact 默认会排除 .github 等以点开头的目录，这是正常的。
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  # 第二步：把上一步的产物发布到 GitHub Pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4